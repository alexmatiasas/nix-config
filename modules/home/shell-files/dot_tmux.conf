# # --- Estética y funcionalidad general ---
set -g mouse on                    # Habilita el uso del mouse
# set -g history-limit 10000         # Aumenta scrollback
# set-option -g terminal-overrides ",xterm-256color:Tc"

# # --- Estilo de barra inferior ---
set -g status-bg colour235
set -g status-fg colour136
set -g status-interval 5
set -g status-left "#[fg=colour10]#S #[fg=colour244]|"
set -g status-right "#[fg=colour244]%Y-%m-%d #[fg=colour10]%H:%M"

# # --- Usa teclas estilo vi para navegar el scroll (modo copia) ---
# setw -g mode-keys vi

# # --- Copiar y pegar con el mouse o teclado ---
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
bind-key -T copy-mode-vi 'Escape' send -X cancel

# # --- Recargar configuración ---
bind r source-file ~/.tmux.conf

# # --- División de paneles ---
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# # --- Cambiar entre paneles más fácilmente ---
bind -n C-h select-pane -L
bind -n C-l select-pane -R
bind -n C-j select-pane -D
bind -n C-k select-pane -U

# # --- Estilo de borde de panel ---
set -g pane-border-style 'fg=red'
set -g pane-active-border-style 'fg=yellow'

# # --- Nombres automáticos de ventanas ---
# set-option -g allow-rename on

# # --- Colores e iconos compatibles con Nerd Fonts ---
set -g status-left-length 60
set -g status-right-length 90

# # --- Deshabilitar renaming automático --- 
set-option -gw automatic-rename off

